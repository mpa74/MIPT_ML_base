[project]
name = "dl-homework"
version = "0.1.0"
description = "Deep Learning homework: fully-connected and convolutional neural networks"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24,<2", "matplotlib>=3.7", "imageio>=2.31,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["classifiers*", "utils*"]

[dependency-groups]
dev = ["ruff>=0.15.12"]
